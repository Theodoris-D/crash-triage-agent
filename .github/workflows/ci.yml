name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain (gcc, gdb)
        run: sudo apt-get update && sudo apt-get install -y gcc gdb libc6-dev

      - name: Install package
        run: pip install -e .[dev]

      - name: Generate benchmark
        run: python benchmark/gen_cases.py

      - name: Validate benchmark invariants
        run: python benchmark/verify.py

      - name: Run tests
        run: python -m pytest

      - name: Offline evaluation (scripted) + report
        run: |
          python eval/harness.py --provider scripted --security-cases 3 --notes "ci"
          python eval/report.py -o eval/report.md
          cat eval/report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.md
