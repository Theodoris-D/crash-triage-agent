[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crash-triage-agent"
version = "0.1.0"
description = "A guarded, MCP-based AI agent that triages crashing C programs, with an adversarial prompt-injection evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Theodoris Donval" }]
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
triage = "triage_agent.cli:main"
triage-mcp-server = "triage_agent.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage_agent = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
